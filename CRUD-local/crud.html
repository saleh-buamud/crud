<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Manager</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="crud.css">
</head>

<body>
    <div class="con-btn-dele">
        <button onclick="clearAll()">Delete All</button>
        <button onclick="ResetAll()">Reset</button>
    </div>
    <div class="container">

        <div class="card">

            <h1>Product Manager</h1>
            <p>Add your products and manage them easily.</p>

            <form id="productForm">

                <div class="form-group">
                    <label for="productName">Product Name</label>

                    <input type="text" id="productName" name="productName" placeholder="Enter product name">
                </div>


                <div class="form-group">
                    <label for="productPrice">Price</label>

                    <input type="number" id="productPrice" name="productPrice" placeholder="Enter price">
                </div>


                <div class="form-group">
                    <label for="productDescription">Description</label>

                    <textarea id="productDescription" name="productDescription" rows="5"
                        placeholder="Write product description..."></textarea>
                </div>


                <!-- Search -->
                <div class="form-group">
                    <label for="searchInput">Search Product</label>

                    <input type="text" id="searchInput" placeholder="Search by name">
                </div>


                <div class="c-btn">

                    <button id="addBtn" type="button" class="btn">
                        <i class="fa-solid fa-plus"></i>
                        Add Product
                    </button>

                    <button class="btn" type="button" onclick="searchProduct()">
                        <i class="fa-solid fa-search"></i>
                        Search
                    </button>

                    <button class="btn" type="button" onclick="clearProducts()">
                        Delete All
                    </button>

                    <select id="sortSelect" class="btn" onchange="sortProducts()">
                        <option value="">Sort By</option>
                        <option value="name-asc">Name: A → Z</option>
                        <option value="name-desc" id="name-desc">Name: Z → A</option>
                        <option value="price-asc" id="price-asc">Price: Low → High</option>
                        <option value="price-desc" id="price-desc">Price: High → Low</option>
                    </select>

                </div>
                <input type="number" id="minPrice" placeholder="Min Price" class="form-control">

                <input type="number" id="maxPrice" placeholder="Max Price" class="form-control">

                <button type="button" class="btn" onclick="filterByPrice()">
                    Filter
                </button>
                <div class="pagination">
                    <button type="button" onclick="previousPage()" class="pagination-btn" id="previousBtn">
                        Previous
                    </button>

                    <button type="button" onclick="nextPage()" class="pagination-btn" id="nextBtn">
                        Next
                    </button>
                </div>

            </form>

        </div>


        <!-- ======================== -->
        <!-- Products Table -->
        <!-- ======================== -->

        <div class="table-card">

            <h2>Products List</h2>

            <div class="table-wrapper">
                <table>

                    <thead>

                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Description</th>
                            <th>Edit</th>
                        </tr>

                    </thead>

                    <tbody id="tableBody">

                        <!-- JS -->

                    </tbody>

                </table>
            </div>

        </div>

    </div>



    <script src="main.js"></script>

</body>

</html>
